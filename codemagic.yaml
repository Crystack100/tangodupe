workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Purrzle ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alden.purrzle
      node: 22
      xcode: latest
      vars:
        APP_ID_BUNDLE: com.alden.purrzle
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: npm ci || npm install
      - name: Sync web game into iOS
        working_directory: mobile
        script: npx cap sync ios
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" mobile/ios/App/App.xcodeproj/project.pbxproj
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project mobile/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play:
    name: Android Play Store
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - purrzle_upload
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        working_directory: mobile
        script: npm ci || npm install
      - name: Sync web game into Android
        working_directory: mobile
        script: npx cap sync android
      - name: Build signed app bundle
        working_directory: mobile/android
        script: chmod +x gradlew && ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
