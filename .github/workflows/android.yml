# Builds an installable Android app file (debug APK) on every push.
name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: purrzle-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # Attach the app file to a "latest" release so it downloads straight to a phone, no unzipping.
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk purrzle.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest purrzle.apk --title "Purrzle (latest build)" --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap purrzle.apk to install."
        env:
          GH_TOKEN: ${{ github.token }}
