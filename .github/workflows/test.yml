# Unit tests, browser tests and a check that the built files match src/.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Built files are up to date (run python3 build.py and commit if this fails)
        run: python3 build.py && git diff --stat --exit-code -- index.html artifact.html crazygames/index.html mobile/www/index.html
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
